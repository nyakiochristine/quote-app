<form class="quote-form" (ngSubmit)="submitQuote(quoteForm)" #quoteForm="ngForm" novalidate>
    <div class="form-field">
        <label for="author">Your name</label>
        <input type="text" id="author" name="author" [(ngModel)]="newQuote.author" #author="ngModel" required autocomplete="name" placeholder="e.g. Maya Angelou">
        <span class="field-error" *ngIf="author.invalid && (author.dirty || author.touched)">Please add your name.</span>
    </div>

    <div class="form-field">
        <label for="quote-text">Your quote</label>
        <textarea id="quote-text" name="quoteText" rows="5" [(ngModel)]="newQuote.quo" #quoteText="ngModel" required minlength="4" placeholder="Write something worth remembering..."></textarea>
        <span class="field-error" *ngIf="quoteText.invalid && (quoteText.dirty || quoteText.touched)">Please add a quote.</span>
    </div>

    <div class="form-field">
        <label for="quote-date">Date</label>
        <input type="date" id="quote-date" name="completeDate" [(ngModel)]="dateValue" #quoteDate="ngModel" required>
    </div>

    <button type="submit" class="submit-button" [disabled]="quoteForm.invalid">Add to collection <span aria-hidden="true">&#8594;</span></button>
</form>
